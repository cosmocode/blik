{% load i18n %}
{% load json_filters %}
{# Answer option rows of a likert or choice question; filled and posted by the option row functions in questionnaire_form.html #}
<div
    class="option-rows"
    {% if id %}id="{{ id }}"{% endif %}
    data-prefix="{{ prefix }}"
    data-weights="{{ weights|yesno:'true,false' }}"
    {% if defaults %}data-defaults="{{ defaults|to_json }}"{% endif %}
>
    <div class="option-rows-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
    <button type="button" class="btn btn-sm btn-secondary" style="margin-top: 0.5rem;" onclick="addOptionRow(this.closest('.option-rows'))">{% trans 'Add option' %}</button>
</div>
